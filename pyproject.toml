[project]
name = "rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "talk2kanwal-cmd", email = "talk2kanwal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=1.5,<2",
    "datasets>=2.19",
    "ipykernel>=7.3.0",
    "langchain==1.4.0",
    "langchain-chroma>=1.1,<2",
    "langchain-community==0.4.1",
    "langchain-core>=1.6,<2",
    "langchain-groq>=1.1,<2",
    "langchain-huggingface>=1.2,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-text-splitters>=1.1,<2",
    "pandas>=2.0",
    "pypdf>=3.17",
    "pytest>=8.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "ragas==0.4.3",
    "rank-bm25==0.2.2",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
    "trafilatura>=1.9",
]

[project.scripts]
rag-assistant = "rag_assistant:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
